---
name: docker

"on":
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: Release image
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test release image
        run: ./scripts/test-docker-release.sh

  publish:
    name: Publish release image
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release tag on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(sed -nE 's/^[[:space:]]*version:[[:space:]]*"([^"]+)",?[[:space:]]*$/\1/p' mix.exs)
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
             [[ "$GITHUB_REF_NAME" != "v$version" ]] ||
             ! git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::Expected a stable tag matching the server version on $DEFAULT_BRANCH"
            exit 1
          fi

      - name: Build and test release image
        run: ./scripts/test-docker-release.sh "ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME"

      - name: Publish tested image and record its digest
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$repository:$GITHUB_REF_NAME"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image" | tee "$RUNNER_TEMP/renga-image-push.log"
          # Use this push's manifest digest, not a later lookup of the mutable tag.
          digest=$(awk -v tag="$GITHUB_REF_NAME:" '$1 == tag && $2 == "digest:" {print $3}' "$RUNNER_TEMP/renga-image-push.log")
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Could not resolve the published image digest"
            exit 1
          fi
          # Keep Markdown code spans literal in the format string.
          # shellcheck disable=SC2016
          printf '### Renga server image\n\nTag: `%s`\n\nDeploy by digest: `%s@%s`\n' \
            "$image" "$repository" "$digest" >> "$GITHUB_STEP_SUMMARY"
