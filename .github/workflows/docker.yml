---
name: docker

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Release image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test release image
        run: ./scripts/test-docker-release.sh
